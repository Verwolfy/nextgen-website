name: NextGen Astro build + security checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python sync requirements
        run: python -m pip install -r requirements-sync.txt
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - name: Prepare original brand images
        run: node scripts/copy_public_assets.mjs
      - name: Prevent unintended Cloudflare deployment commands
        run: python scripts/check_no_unapproved_deployment.py
      - name: Run strict publication tests
        run: python -m unittest discover -s tests -v && python scripts/check_public_content.py
      - name: Run disabled-by-default lead endpoint tests
        run: node --test tests/lead_endpoint.test.mjs
      - name: Install locked Astro dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile static trilingual site
        run: npm run build
      - name: Measure V3 payload and enforce original media budgets
        run: python scripts/check_v3_static_payload.py
      - name: Upload lightweight V3 metrics (private diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextgen-v3-static-payload-audit
          path: .ci-artifacts/lot93-v3-static-payload.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Validate internal links, three languages, RTL and disabled forms
        run: python scripts/check_built_pages.py
      - name: Fail closed on partial FENEK-FLOW packshot uploads
        run: python scripts/check_flow_packshots_built.py
      - name: Check 10 FENEK-BOND images when uploaded
        run: python scripts/check_bond_packshots_built.py
      - name: Validate deployable Pages files (no deployment)
        run: |
          python scripts/preprod_static_audit.py
          python scripts/check_cloudflare_release.py
      - name: Assert non-publication guardrails
        run: |
          test -f dist/fr/index.html
          test -f dist/ar/index.html
          test -f dist/en/index.html
          test -f dist/images/Logo1.jpg
          ! test -e dist/fr/emballages
          ! test -e dist/ar/emballages
          ! test -e dist/en/emballages
          ! test -e dist/models-demo
          ! test -e dist/images/3d-demo
          ! grep -R -i 'SUPABASE_SERVICE_ROLE_KEY' dist
          ! grep -R -i 'ISO 9001' dist

      - name: Upload private Pages static build for review only
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: nextgen-cloudflare-dist-review
          path: dist/
          retention-days: 7
          if-no-files-found: error
