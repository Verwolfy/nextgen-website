name: NextGen - verify live manufacturing approach (read-only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-approach-readonly.yml"
      - "scripts/check_public_manufacturing_approach.py"
      - "src/components/AboutStory.astro"
      - "src/data/editorial.ts"
      - "public/images/approche/**"

permissions:
  contents: read

jobs:
  verify:
    name: Verify FR AR EN and local illustrations on public domain
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check hosted pages, noindex and SVG checksums (GET only)
        run: python scripts/check_public_manufacturing_approach.py
      - name: Archive anonymous release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: nextgen-lot80-live-manufacturing-readonly
          path: .ci-artifacts/lot80-public-demarche.json
          if-no-files-found: warn
          retention-days: 7
