name: One-time cleanup of merged legacy branches
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-merged-branches-20261114.yml
permissions:
  contents: write
  pull-requests: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Delete only branch tips fully reachable from main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, json, time, urllib.request, urllib.error, urllib.parse
          repo=os.environ["GH_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          root=f"https://api.github.com/repos/{repo}"
          headers={
              "Authorization": f"Bearer {token}",
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"nextgen-merged-branch-cleanup"
          }
          def api(method,path):
              req=urllib.request.Request(root+path,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=30) as response:
                  payload=response.read()
                  return json.loads(payload) if payload else None
          # Fail closed: never delete any branch that currently heads an open PR.
          prs=[]
          page=1
          while True:
              batch=api("GET",f"/pulls?state=open&per_page=100&page={page}")
              prs.extend(batch)
              if len(batch)<100: break
              page+=1
          protected={pr["head"]["ref"] for pr in prs if pr["head"]["repo"] and pr["head"]["repo"]["full_name"]==repo}
          branches=[]
          page=1
          while True:
              batch=api("GET",f"/branches?per_page=100&page={page}")
              branches.extend(batch)
              if len(batch)<100: break
              page+=1
          deleted=[]; skipped=[]; failures=[]
          main_ref=api("GET","/git/ref/heads/main")["object"]["sha"]
          for branch in branches:
              name=branch["name"]
              if name=="main" or name in protected or branch.get("protected"):
                  skipped.append((name,"main/open-PR/protected"));continue
              encoded=urllib.parse.quote(name,safe="/")
              try:
                  cmp=api("GET",f"/compare/main...{urllib.parse.quote(name,safe='/')}")
                  # Deleted refs must have no commits outside main, and must not have moved.
                  current=api("GET",f"/git/ref/heads/{encoded}")["object"]["sha"]
                  current_main=api("GET","/git/ref/heads/main")["object"]["sha"]
                  if cmp["ahead_by"]!=0 or current!=branch["commit"]["sha"] or current_main!=main_ref:
                      skipped.append((name,f"ahead={cmp['ahead_by']} or ref changed"));continue
                  api("DELETE",f"/git/refs/heads/{encoded}")
                  deleted.append(name)
                  print("DELETED",name,flush=True)
              except Exception as exc:
                  failures.append((name,str(exc)))
                  print("FAILED",name,str(exc),flush=True)
              time.sleep(0.15)
          print("SUMMARY",json.dumps({"initial":len(branches),"deleted":deleted,"skipped":skipped,"failures":failures},ensure_ascii=False))
          if failures: raise SystemExit(f"{len(failures)} GitHub REST deletions failed")
          PY
