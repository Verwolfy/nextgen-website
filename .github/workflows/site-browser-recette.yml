name: NextGen protected browser recipe

on:
  push:
    branches: ["feat/lot7-browser-recette-20261101"]
  pull_request:
    paths:
      - "src/**"
      - "scripts/check_built_pages.py"
      - "scripts/check_browser_pages.py"
      - ".github/workflows/site-browser-recette.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked site dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile static site
        run: npm run build
      - name: Verify 45 localized routes and locked-down forms
        run: python scripts/check_built_pages.py
      - name: Install isolated browser recipe tooling
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test desktop and mobile in Chromium
        run: python scripts/check_browser_pages.py
      - name: Upload internal screenshots (not published)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextgen-lot7-internal-browser-screenshots
          path: .ci-artifacts/screenshots/
          retention-days: 7
          if-no-files-found: ignore
