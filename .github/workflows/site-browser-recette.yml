name: NextGen protected browser recipe

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "public/images/illustrations/catalogue-projects/**"
      - "scripts/check_flow_packshots_built.py"
      - "scripts/check_bond_packshots_built.py"
      - "scripts/check_built_pages.py"
      - "scripts/check_browser_pages.py"
      - "scripts/measure_v3_local_browser.py"
      - ".github/workflows/site-browser-recette.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked site dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile static site
        run: npm run build
      - name: Verify 42 localized routes and locked-down forms
        run: python scripts/check_built_pages.py
      - name: Validate FENEK-FLOW images if uploaded
        run: python scripts/check_flow_packshots_built.py
      - name: Check 10 FENEK-BOND images when uploaded
        run: python scripts/check_bond_packshots_built.py
      - name: Install isolated browser recipe tooling
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test desktop and mobile in Chromium
        run: python scripts/check_browser_pages.py
      - name: Collect local V3 browser timing baseline (no CWV gate)
        run: python scripts/measure_v3_local_browser.py
      - name: Upload private local browser metrics
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: nextgen-v3-local-browser-metrics
          path: .ci-artifacts/lot95-97-browser-metrics.json
          retention-days: 7
          if-no-files-found: warn
      - name: Upload internal screenshots (not published)
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: nextgen-lot7-internal-browser-screenshots
          path: .ci-artifacts/screenshots/
          retention-days: 7
          if-no-files-found: ignore
