name: NextGen - actualites et cotations officielles quotidiennes
on:
  schedule:
    - cron: '37 6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ticker-daily-verified.yml'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: nextgen-ticker-daily-verified
  cancel-in-progress: false
jobs:
  verify_and_refresh:
    if: github.repository == 'Verwolfy/nextgen-website'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned source-check requirements
        run: python -m pip install -r requirements-sync.txt
      - name: Verify source and refresh local trilingual register
        run: python scripts/refresh_ticker_daily.py --report .ci-artifacts/ticker-daily.json
      - name: Determine whether currency copy changed
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- src/data/nextgen-ticker.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run all unit and publication security tests before writing
        if: steps.changes.outputs.changed == 'true'
        run: |
          python scripts/check_no_unapproved_deployment.py
          python -m unittest discover -s tests -v
          python scripts/check_public_content.py
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version-file: '.node-version'
      - name: Build and audit all three languages before writing
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm ci --no-audit --no-fund
          npm run build
          python scripts/check_built_pages.py
          python scripts/preprod_static_audit.py
          python scripts/check_cloudflare_release.py
          python scripts/check_v3_static_payload.py
      - name: Install isolated Chromium
        if: steps.changes.outputs.changed == 'true'
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test visible ticker FR AR EN before writing
        if: steps.changes.outputs.changed == 'true'
        run: python scripts/check_browser_pages.py
      - name: Commit only vetted ticker values
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/data/nextgen-ticker.ts
          git commit -m "chore(ticker): refresh verified FX quotations FR AR EN"
          git push origin HEAD:main
      - name: Alert once for expiring APS editorial entries
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -f .ci-artifacts/ticker-daily.json || exit 0
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path(".ci-artifacts/ticker-daily.json").read_text(encoding="utf-8"))
          items=report.get("editorial_expiring",[])
          if items:
              lines=["# Renouvellement APS nécessaire", "",
                     "Ces sujets expirent. Vérifier de nouvelles sources et préparer FR/AR/EN, sans redater une ancienne dépêche.", "",
                     "| ID | Catégorie | Publié | Expire | Jours restants |",
                     "|---|---|---|---|---|"]
              lines += [f"| {x['id']} | {x['category']} | {x['published']} | {x['expires']} | {x['remaining_days']} |" for x in items]
              Path(".ci-artifacts/ticker-editorial-alert.md").write_text("\n".join(lines)+"\n",encoding="utf-8")
          PY
          if test -f .ci-artifacts/ticker-editorial-alert.md; then
            count=$(gh issue list --state open --limit 100 --json title --jq '[.[] | select(.title=="NextGen : renouveler les actualites BTPH du fil")] | length' 2>/dev/null || echo 0)
            if [ "$count" = "0" ]; then
              gh issue create --title 'NextGen : renouveler les actualites BTPH du fil' --body-file .ci-artifacts/ticker-editorial-alert.md || echo "::warning::Editorial issue unavailable"
            fi
          fi
      - name: Archive daily verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextgen-ticker-official-source-daily
          path: |
            .ci-artifacts/ticker-daily.json
            .ci-artifacts/ticker-editorial-alert.md
          retention-days: 14
          if-no-files-found: warn
