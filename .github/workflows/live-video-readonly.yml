name: NextGen — vérification HTTP V2 sans déploiement

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-video-readonly.yml"
      - "scripts/check_live_video_deployment.py"
      - "public/videos/nextgen-nexo-geno-welcome.mp4"
      - "public/videos/nextgen-nexo-geno-poster.webp"
      - "src/components/HeroWelcomeVideo.astro"

permissions:
  contents: read

jobs:
  probe:
    name: Inspect anonymous HTTP only (never deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit HTTPS pages and V2 media hashes without authentication
        run: python scripts/check_live_video_deployment.py
      - name: Archive read-only diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextgen-public-http-readonly-check
          path: .ci-artifacts/lot62-live-check.json
          if-no-files-found: warn
          retention-days: 7
