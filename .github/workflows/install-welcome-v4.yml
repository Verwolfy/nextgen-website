name: NextGen - install verified welcome V4 media
on:
  pull_request:
    paths:
      - '.media-staging/lot116/**'
      - 'scripts/install_welcome_v4.py'
      - '.github/workflows/install-welcome-v4.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-welcome-v4.yml'
permissions:
  contents: write
jobs:
  verify_staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify both assets and pinned SHA256
        run: python scripts/install_welcome_v4.py --check
  upload_binary:
    needs: verify_staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Restore verified video and poster files
        run: python scripts/install_welcome_v4.py
      - name: Commit only verified public media and remove transport fragments
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/videos/nextgen-nexo-geno-welcome-v4.mp4 public/videos/nextgen-nexo-geno-poster-v4.webp
          git rm -r -- .media-staging/lot116
          git diff --cached --check
          git commit -m "chore(media): install validated Nexo Geno welcome V4 MP4 and poster"
          git pull --rebase origin main
          git push origin HEAD:main
