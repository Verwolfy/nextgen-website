name: NextGen - Cloudflare live production smoke (read-only)

# GitHub->Cloudflare Pages deploys main automatically. No deploy hook or API token.
# After each main commit (and daily), wait for Cloudflare's exact commit SHA.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nextgen-cloudflare-live-production
  cancel-in-progress: true

jobs:
  verify-production:
    name: Production release + FR/AR/EN search
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait for the exact main commit on Cloudflare, then check public assets
        env:
          EXPECTED_MAIN_SHA: ${{ github.sha }}
        run: |
          python scripts/check_live_production.py \
            --origin https://nextgen-buildingsolutions.com \
            --expected-sha "$EXPECTED_MAIN_SHA" \
            --attempts 24 --interval 20 --timeout 15
      - name: Install isolated Chromium smoke test tools
        run: |
          python -m pip install --disable-pip-version-check "playwright==1.56.0"
          python -m playwright install --with-deps chromium
      - name: Test the real live Pagefind search (Chromium, FR/AR/EN, 390/1440px)
        run: |
          python scripts/check_live_browser.py --origin https://nextgen-buildingsolutions.com
