name: NextGen - Cloudflare live production smoke (read-only)

# GitHub->Cloudflare Pages deploys main automatically. No deploy hook or API token.
# After each main commit (and daily), wait for Cloudflare's exact commit SHA.
on:
  pull_request:
    paths:
      - ".github/workflows/cloudflare-live-production-smoke.yml"
      - "scripts/check_live_production.py"
      - "scripts/check_live_browser.py"
      - "scripts/check_live_application_guides.py"
      - "scripts/write_release_marker.mjs"
      - "tests/test_lot120_cloudflare_live_smoke.py"
      - "tests/test_lot122_cloudflare_illustration_live.py"
      - "package.json"
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nextgen-cloudflare-live-production
  cancel-in-progress: true

jobs:
  offline-contracts:
    name: Offline monitor contract / syntax
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate monitor syntax and read-only contract tests
        run: |
          python -m py_compile scripts/check_live_production.py scripts/check_live_browser.py scripts/check_live_application_guides.py
          node --check scripts/write_release_marker.mjs
          python -m unittest discover -s tests -p 'test_lot120_cloudflare_live_smoke.py' -v
          python -m unittest discover -s tests -p 'test_lot122_cloudflare_illustration_live.py' -v

  verify-production:
    if: github.event_name != 'pull_request'
    name: Production release + FR/AR/EN search
    # Playwright 1.56 requires an officially supported Ubuntu runner.
    # ubuntu-latest currently resolves to 26.04, where Chromium installation fails.
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait for the exact main commit on Cloudflare, then check public assets
        env:
          EXPECTED_MAIN_SHA: ${{ github.sha }}
        run: |
          python scripts/check_live_production.py \
            --origin https://nextgen-buildingsolutions.com \
            --expected-sha "$EXPECTED_MAIN_SHA" \
            --attempts 24 --interval 20 --timeout 15
      - name: Verify all 150 deployed application walkthroughs and original user drawings
        run: |
          python scripts/check_live_application_guides.py \
            --origin https://nextgen-buildingsolutions.com \
            --workers 6 --timeout 15
      - name: Install isolated Chromium smoke test tools
        run: |
          python -m pip install --disable-pip-version-check "playwright==1.56.0"
          python -m playwright install --with-deps chromium
      - name: Test the real live Pagefind search (Chromium, FR/AR/EN, 390/1440px)
        run: |
          python scripts/check_live_browser.py --origin https://nextgen-buildingsolutions.com
