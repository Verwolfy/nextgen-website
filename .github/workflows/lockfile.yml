name: NextGen npm lockfile maintenance
on:
  push:
    paths:
      - package.json
      - .github/workflows/lockfile.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and lock exact package versions
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile only if new or changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(deps): record reproducible Astro lockfile'
            git push
          fi

  prune-legacy-branches:
    name: One-time cleanup of 16 verified obsolete Git refs
    if: github.repository == 'Verwolfy/nextgen-website' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete only named secondary refs at their verified SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$GH_REPO" = 'Verwolfy/nextgen-website'
          test "$GITHUB_REF" = 'refs/heads/main'
          open_prs=$(gh api "repos/$GH_REPO/pulls?state=open&per_page=100" --jq 'length')
          test "$open_prs" = 0 || { echo "::error::Open PRs remain"; exit 1; }
          while IFS='|' read -r branch expected; do
            test -n "$branch" || continue
            test "$branch" != "main" || exit 1
            actual=$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')
            if test "$actual" != "$expected"; then
              echo "::error::Ref moved since audit: $branch"
              exit 1
            fi
            gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$branch" --silent
            echo "Deleted verified ref: $branch"
          done <<'NEXTGEN_PRUNE_EXPECTED_REFS'
          diagnostic/cloudflare-domain-cache-20261102|71d13f7001daa4d9809eaeba4574ddbd7f527c5a
          docs/fenek-tds-drafts-20261103|e77365e2e322c46f972c33de5ac65d183333219c
          feat/cloudflare-release-ready-20261101|da66152e2c102e5d5e5a723ae43cad15dde3da14
          feat/lot7-browser-recette-20261101|cb2a5ad8b895cc1ebb52db1cf212673d142366bd
          feat/lot8-preproduction-gates-20261101|f43f3a10314fd4a4c15222d69309e93c1a3c8ca7
          feat/lot9-access-gate-20261101|b1ce6ca9dd03908b595f19eca959100b0ca03fbf
          feat/lot60-theme-toggle-locale-menu-20261104|c1da5cc5ae53d8f9a279cabb99dbf5c3885faf39
          feat/lot116-home-v4-video-clean-hero-20261107|6f36272571e95afe094d0a0a1aa9b4bf887daa60
          feat/lot128-v3-product-by-product-20261111|26f140c8966fd048bf83ef9164bda2b92573e605
          feat/lot129-v3-50-guides-reconciled-20261111|5727a55d47d88038eff8ff8e538d00c1e984af54
          feat/lot129-v3-guides-c2ft-20261111|a5c0881bfb09156363f508521e2ccee8d0758d8a
          feat/lot139-140-professional-paint-illustrations-20261112|7dc081ee7965965c0b059974160c6eb759bca287
          fix/public-copy-cleanup-fr-ar-en-20261102|3a55bf7d1df1de107540da14990586e777091ba9
          fix/public-editorial-residual-lot34-20261102|6a6c02da6de5071a1bda8e3db95fbff14b190430
